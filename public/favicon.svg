<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" ry="96" fill="#0f0e14"/>
  <!-- Pixel-style "D" inspired by Press Start 2P -->
  <g fill="white">
    <!-- Left vertical bar -->
    <rect x="128" y="96" width="64" height="320"/>
    <!-- Top horizontal -->
    <rect x="192" y="96" width="128" height="64"/>
    <!-- Bottom horizontal -->
    <rect x="192" y="352" width="128" height="64"/>
    <!-- Top right curve -->
    <rect x="320" y="128" width="64" height="64"/>
    <!-- Right vertical -->
    <rect x="352" y="192" width="64" height="128"/>
    <!-- Bottom right curve -->
    <rect x="320" y="320" width="64" height="64"/>
  </g>
</svg>
